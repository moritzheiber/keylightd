name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        architecture:
          - amd64
          - arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Verify tag version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Build Ubuntu 26.04 Debian package
        run: scripts/build-deb.sh --architecture "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v7
        with:
          name: keylightd-${{ matrix.architecture }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
          generate_release_notes: true
